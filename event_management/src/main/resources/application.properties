spring.application.name=event_management

spring.datasource.url=jdbc:h2:mem:eventmanagement
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


jpa:
database-platform: org.hibernate.dialect.H2Dialect
hibernate:
ddl-auto: update
show-sql: true
open-in-view: false

h2:
console:
enabled: true
path: /h2-console

server:
port: 8080
